# Checks, tests, and builds the app and its website. On main, it deploys them to GitHub Pages:
# the website at the root, and the app under /app/.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      # The traces of the failed browser tests, to open with `npx playwright show-trace`.
      - name: Upload the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
